name: Deploy dev to AWS

on:
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  aws-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_APP_CLIENT_ID: ${{secrets.VITE_APP_CLIENT_ID}}
      VITE_APP_API_URL: ${{secrets.VITE_APP_API_URL}}
      VITE_APP_CLIENT_URL: ${{secrets.VITE_APP_CLIENT_URL}}
      VITE_APP_SITE_URL: ${{secrets.VITE_APP_SITE_URL}}
    steps:
      - uses: actions/checkout@v3
        with:
          ref: dev

      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm' # speeds up repeated installs

      - name: Create .env file
        run: |
          touch .env
          echo VITE_APP_CLIENT_ID="$VITE_APP_CLIENT_ID" >> .env
          echo VITE_APP_API_URL="$VITE_APP_API_URL" >> .env
          echo VITE_APP_CLIENT_URL="$VITE_APP_CLIENT_URL" >> .env
          echo VITE_APP_SITE_URL="$VITE_APP_SITE_URL" >> .env

      - name: Install dependencies (ignore peer conflicts)
        run: npm ci --legacy-peer-deps

      - name: Build app
        run: npm run build

      - name: Bundle app
        run: npm run bundle

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@v2.1.1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "dist/"
          REMOTE_HOST: "project3.eaglesoftwareteam.com"
          REMOTE_USER: ubuntu
          TARGET: "/var/www/html/seiv2025/p3/t4"



